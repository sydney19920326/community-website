<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nachrichten - Community</title>
    <meta name="description" content="Community Nachrichten">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .messaging-container {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: var(--spacing-lg);
            height: calc(100vh - 200px);
        }

        .conversations-sidebar {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            overflow-y: auto;
        }

        .conversation-item {
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            cursor: pointer;
            margin-bottom: var(--spacing-sm);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .conversation-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .conversation-item.active {
            background: var(--primary);
        }

        .conversation-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .conversation-info {
            flex: 1;
        }

        .conversation-name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .conversation-preview {
            font-size: 0.9rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            background: var(--primary);
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .chat-area {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .messages-container {
            flex: 1;
            padding: var(--spacing-lg);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
        }

        .message {
            display: flex;
            gap: var(--spacing-md);
            max-width: 70%;
        }

        .message.sent {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .message-content {
            background: rgba(255, 255, 255, 0.05);
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
        }

        .message.sent .message-content {
            background: var(--primary);
        }

        .message-text {
            color: var(--text-primary);
            margin-bottom: var(--spacing-xs);
        }

        .message-time {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .message-input-area {
            padding: var(--spacing-lg);
            border-top: 1px solid var(--border);
            display: flex;
            gap: var(--spacing-md);
        }

        .message-input-area textarea {
            flex: 1;
            resize: none;
            min-height: 60px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
        }

        @media (max-width: 768px) {
            .messaging-container {
                grid-template-columns: 1fr;
            }

            .conversations-sidebar {
                display: none;
            }

            .conversations-sidebar.mobile-show {
                display: block;
            }

            .chat-area.mobile-hide {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="animated-bg"></div>
    <header id="global-header"></header>

    <div class="container" style="padding-top: 3rem; padding-bottom: 3rem;">
        <div class="messaging-container">
            <!-- Conversations Sidebar -->
            <div class="conversations-sidebar">
                <h2 style="margin-bottom: var(--spacing-lg);">Nachrichten</h2>
                <div id="conversations-list">
                    <div class="text-center text-muted">Lade Konversationen...</div>
                </div>
            </div>

            <!-- Chat Area -->
            <div class="chat-area">
                <div id="chat-content" class="empty-state">
                    <h3>Wähle eine Konversation</h3>
                    <p>Wähle einen Kontakt aus der Liste, um zu chatten</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
    <script src="auth.js"></script>
    <script src="api.js"></script>
    <script src="messages.js"></script>
</body>

</html>
